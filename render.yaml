services:
  - type: web
    name: terabox-bridge
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TERABOX_COOKIE
        sync: false